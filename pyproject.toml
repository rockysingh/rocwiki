[project]
name = "rocwiki"
version = "0.1.0"
description = "Local per-project wiki with MCP + HTTP surfaces, backed by SQLite."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["mcp", "wiki", "sqlite", "notes", "claude", "context", "knowledge-base"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Utilities",
]
dependencies = [
    "fastmcp>=4.0",
    "uvicorn>=0.30",
    "starlette>=0.37",
]

[project.urls]
Homepage = "https://github.com/rockysingh/rocwiki"
Source   = "https://github.com/rockysingh/rocwiki"
Issues   = "https://github.com/rockysingh/rocwiki/issues"

[project.scripts]
rocwiki = "rocwiki.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["rocwiki*"]